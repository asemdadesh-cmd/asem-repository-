    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/anton.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "NotoJP";
        src: url("assets/fonts/notojp-black.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/spacegrotesk.woff2") format("woff2");
        font-weight: 500;
      }
      :root {
        --ink: #05020c;
        --violet: #8b5cff;
        --magenta: #ff2fb4;
        --cyan: #35f2ff;
        --paper: #f4efff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Space Grotesk", sans-serif;
        color: var(--paper);
      }
      .full {
        position: absolute;
        inset: 0;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .scn {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      svg {
        display: block;
      }
      .defs {
        position: absolute;
        width: 0;
        height: 0;
      }

      /* ---------- global layers ---------- */
      #bg {
        background: radial-gradient(circle at 50% 38%, #2a0f5c 0%, #0b0620 55%, #03020a 100%);
      }
      #bgHot {
        opacity: 0;
        background: radial-gradient(circle at 50% 45%, #ff2fb4 0%, #5b10a8 38%, #0b0220 80%);
      }
      #rain {
        pointer-events: none;
      }
      .drop {
        position: absolute;
        top: -220px;
        width: 2px;
        background: linear-gradient(180deg, rgba(160, 200, 255, 0), rgba(190, 220, 255, 0.55));
      }
      #speed {
        opacity: 0;
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      #grain {
        opacity: 0.16;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
        background-size: 300px 300px;
      }
      #scan {
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.16) 2px 4px);
      }
      #vignette {
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.78) 100%);
      }
      #fade {
        background: #000;
        opacity: 0;
      }

      /* ---------- typography ---------- */
      .kanji {
        font-family: "NotoJP", sans-serif;
        font-weight: 900;
        line-height: 1;
      }
      .display {
        font-family: "Anton", sans-serif;
        text-transform: uppercase;
        line-height: 0.9;
        letter-spacing: 0.01em;
      }
      .mono {
        font-family: "Space Grotesk", sans-serif;
        letter-spacing: 0.5em;
        text-transform: uppercase;
      }

      /* S1 */
      #s1-kanji {
        font-size: 330px;
        color: #fff;
        text-shadow:
          0 0 30px var(--violet),
          0 0 90px var(--violet),
          6px 0 0 rgba(255, 47, 180, 0.7),
          -6px 0 0 rgba(53, 242, 255, 0.7);
      }
      #s1-sub {
        margin-top: 60px;
        font-size: 34px;
        color: #cdbcff;
      }

      /* S2 */
      #s2-tag {
        position: absolute;
        top: 220px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 30px;
        color: var(--cyan);
        text-shadow: 0 0 18px var(--cyan);
      }

      /* S3 */
      .s3 {
        background: radial-gradient(circle at 50% 50%, #26093f 0%, #070211 70%);
      }
      .s3 .art {
        width: 1000px;
        height: 1000px;
      }
      .slam {
        position: absolute;
        bottom: 250px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
      }
      .slam span {
        display: block;
        font-size: 250px;
        color: #fff;
        -webkit-text-stroke: 4px var(--ink);
        text-shadow:
          10px 10px 0 var(--magenta),
          -8px -6px 0 var(--cyan),
          0 0 60px rgba(139, 92, 255, 0.9);
      }

      /* S4 manga */
      #s4 {
        background: var(--paper);
      }
      .panel {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .panel .fill {
        position: absolute;
        inset: 0;
      }
      .tone {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.35) 28%, transparent 30%);
        background-size: 16px 16px;
        mix-blend-mode: overlay;

      #p1 {
        clip-path: polygon(0 0, 100% 0, 100% 29%, 0 39%);

      #p2 {
        clip-path: polygon(0 41.5%, 100% 31.5%, 100% 65%, 0 72%);

      #p2-man {

      /* S5 drop */

      .glitch {

        display: flex;

        font-size: 300px;

      .glitch .c {
        color: var(--cyan);
        mix-blend-mode: screen;
      }
      .glitch .m {

      }

    <script>
      (function () {
        const SVGNS = "http://www.w3.org/2000/svg";
        // Seeded PRNG — deterministic art + motion.
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rnd = mulberry32(20260924);
        const R = (a, b) => a + (b - a) * rnd();
        const el = (tag, attrs, parent) => {
          const n = document.createElementNS(SVGNS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(n);
          return n;
        };

        // ---------- build art ----------
        // Skyline: far + near layers, neon windows, moon.
        const far = document.getElementById("city-far");
        const near = document.getElementById("city-near");
        const moonG = el("radialGradient", { id: "moonGrad" }, el("defs", {}, far));
        el("stop", { offset: "0", "stop-color": "#ffe3f6" }, moonG);
        el("stop", { offset: "0.6", "stop-color": "#ff5fc8" }, moonG);
        el("stop", { offset: "1", "stop-color": "#ff2fb4", "stop-opacity": "0" }, moonG);
        el("circle", { cx: 700, cy: 560, r: 330, fill: "url(#moonGrad)", opacity: 0.55 }, far);
        el("circle", { cx: 700, cy: 560, r: 190, fill: "#ffd9f1" }, far);
        const neon = ["#35f2ff", "#ff2fb4", "#ffd36b", "#8b5cff"];
        function skyline(svg, fill, hMin, hMax, wMin, wMax, lit) {
          let x = -30;
          while (x < 1110) {
            const w = R(wMin, wMax);
            const h = R(hMin, hMax);
            const top = 1920 - h;
            el("rect", { x, y: top, width: w, height: h, fill }, svg);
            if (rnd() < 0.35) el("rect", { x: x + w / 2 - 3, y: top - R(60, 160), width: 6, height: 160, fill }, svg);
            for (let wy = top + 30; wy < 1900; wy += 34) {
              for (let wx = x + 12; wx < x + w - 16; wx += 26) {
                if (rnd() < lit) {
                  el("rect", { x: wx, y: wy, width: 12, height: 16, fill: neon[Math.floor(rnd() * 4)], opacity: R(0.35, 0.95) }, svg);
                }
              }
            }
            if (rnd() < 0.3) {
              const c = neon[Math.floor(rnd() * 3)];
              el("rect", { x: x + 8, y: top + 60, width: 18, height: R(200, 380), fill: c, opacity: 0.9, style: "filter:drop-shadow(0 0 14px " + c + ")" }, svg);
            }
            x += w + R(4, 14);
          }
        }
        skyline(far, "#150a30", 900, 1450, 90, 170, 0.12);
        skyline(near, "#06020f", 450, 900, 110, 210, 0.2);

        // Katana hilt close-up.
        const hilt = document.getElementById("hilt");
        el("rect", { x: 170, y: -40, width: 60, height: 420, fill: "url(#bladeGrad)" }, hilt);
        el("line", { x1: 200, y1: -40, x2: 200, y2: 380, stroke: "#fff", "stroke-width": 2, opacity: 0.7 }, hilt);
        el("rect", { x: 160, y: 370, width: 80, height: 34, fill: "#c9a24a" }, hilt);
        el("ellipse", { cx: 200, cy: 420, rx: 160, ry: 42, fill: "#1a1026", stroke: "#c9a24a", "stroke-width": 8 }, hilt);
        el("rect", { x: 162, y: 450, width: 76, height: 400, rx: 10, fill: "#120a1c" }, hilt);
        for (let i = 0; i < 9; i++) {
          const y = 480 + i * 42;
          el("polygon", { points: `200,${y - 22} 232,${y} 200,${y + 22} 168,${y}`, fill: "#8b5cff", opacity: 0.9 }, hilt);
        }
        el("ellipse", { cx: 200, cy: 858, rx: 46, ry: 18, fill: "#c9a24a" }, hilt);

        // Rain streaks.
        const rain = document.getElementById("rain");
        const drops = [];
        for (let i = 0; i < 80; i++) {
          const d = document.createElement("div");
          d.className = "drop";
          d.style.left = R(0, 1080).toFixed(1) + "px";
          d.style.height = R(90, 200).toFixed(0) + "px";
          d.style.opacity = R(0.25, 0.8).toFixed(2);
          rain.appendChild(d);
          drops.push({ node: d, off: R(0, 2300), speed: R(2600, 4200) });
        }

        // Radial manga speed lines.
        const speed = document.getElementById("speed");
        const cx = 540,
          cy = 960;
        for (let i = 0; i < 90; i++) {
          const a = (i / 90) * Math.PI * 2 + R(-0.02, 0.02);
          const spread = R(0.004, 0.014);
          const r0 = R(330, 560),
            r1 = 1500;
          const p = (ang, r) => `${cx + Math.cos(ang) * r},${cy + Math.sin(ang) * r}`;
          el("polygon", { points: `${p(a, r0)} ${p(a - spread, r1)} ${p(a + spread, r1)}`, fill: i % 3 ? "#fff" : "#cdbcff", opacity: R(0.35, 0.9) }, speed);
        }

        // Sparks for the slashes.
        const sparks = document.getElementById("sparks");
        const sparkData = [];
        for (let i = 0; i < 56; i++) {
          const s = document.createElement("div");
          s.className = "spark";
          sparks.appendChild(s);
          sparkData.push({ node: s, ang: R(0, 360), dist: R(160, 520), wave: i < 28 ? 0 : 1, u: R(0.15, 0.85) });
        }

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true });
        const BEAT = 0.5;

        // Background grade shifts
        tl.to("#bgHot", { opacity: 0.55, duration: 0.15, ease: "none" }, 10);
        tl.to("#bgHot", { opacity: 0.25, duration: 1.8, ease: "power2.out" }, 10.2);
        tl.to("#bgHot", { opacity: 0, duration: 1.2, ease: "power1.inOut" }, 16.8);

        // Rain: seek-safe wraparound via modifiers.
        drops.forEach((d) => {
          tl.to(
            d.node,
            {
              y: d.speed * 20,
              duration: 20,
              ease: "none",
              modifiers: { y: (v) => (((parseFloat(v) + d.off) % 2300) - 100).toFixed(1) + "px" },
            },
            0
          );
        });

        // Film grain jitter @12fps (stepped sets).
        for (let f = 0, t = 0; t < 20; f++, t = f / 12) {
          tl.set("#grain", { backgroundPosition: `${Math.floor(R(0, 300))}px ${Math.floor(R(0, 300))}px` }, t);
        }

        // Helpers
        function flash(t, peak = 0.95, dur = 0.28) {
          tl.fromTo("#flash", { opacity: peak }, { opacity: 0, duration: dur, ease: "power2.out", immediateRender: false }, t);
        }
        function shake(t, amp = 26, steps = 7) {
          for (let i = 0; i < steps; i++) {
            const k = 1 - i / steps;
            tl.to(".scn", { x: R(-amp, amp) * k, y: R(-amp, amp) * k, duration: 0.035, ease: "none" }, t + i * 0.035);
          }
          tl.to(".scn", { x: 0, y: 0, duration: 0.05, ease: "power1.out" }, t + steps * 0.035);
        }
        function speedBurst(t, hold = 0.45, peak = 0.85) {
          tl.fromTo("#speed", { opacity: peak, scale: 1.25, rotation: 0 }, { opacity: 0, scale: 1, rotation: 4, duration: hold, ease: "power2.out", immediateRender: false, transformOrigin: "50% 50%" }, t);
        }

        // S1 — awakening
        tl.fromTo("#s1-kanji", { opacity: 0, scale: 1.35, filter: "blur(24px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.2, ease: "power3.out" }, 0.1);
        tl.fromTo("#s1-sub", { opacity: 0, scaleX: 1.6 }, { opacity: 1, scaleX: 1, duration: 1.1, ease: "power2.out" }, 0.5);
        tl.to("#s1-kanji", { scale: 1.08, duration: 0.7, ease: "power1.in" }, 1.3);
        tl.to("#s1 .scn", { opacity: 0, duration: 0.12, ease: "none" }, 1.88);

        // S2 — city
        flash(2.0);
        speedBurst(2.0, 0.6);
        shake(2.0, 30);
        tl.fromTo("#city-far", { scale: 1.02, transformOrigin: "50% 100%" }, { scale: 1.1, duration: 2, ease: "none" }, 2);
        tl.fromTo("#city-near", { scale: 1.0, y: 80, transformOrigin: "50% 100%" }, { scale: 1.28, y: 0, duration: 2, ease: "power1.in" }, 2);
        tl.fromTo("#s2-tag", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.3);
        tl.to("#s2-tag", { opacity: 0.25, duration: 0.05, repeat: 3, yoyo: true, ease: "none" }, 3.3);

        // S3 — rapid cuts on the beat-and-a-half
        ["#s3a", "#s3b", "#s3c", "#s3d"].forEach((id, i) => {
          const t = 4 + i * 0.75;
          flash(t, 1, 0.2);
          shake(t, 34);
          tl.fromTo(`${id} .slam span`, { scale: 2.6, skewX: -10, opacity: 0 }, { scale: 1, skewX: -10, opacity: 1, duration: 0.14, ease: "expo.out" }, t + 0.02);
          tl.to(`${id} .slam span`, { scale: 1.08, duration: 0.55, ease: "none" }, t + 0.16);
        });
        tl.fromTo("#s3a .art", { scale: 1.25 }, { scale: 1.45, duration: 0.75, ease: "none" }, 4);
        tl.fromTo("#hilt", { y: 120, rotation: -6 }, { y: -40, rotation: 2, duration: 0.75, ease: "power1.out" }, 4.75);
        tl.fromTo("#glintBar", { attr: { x: -400 } }, { attr: { x: 1300 }, duration: 0.5, ease: "power2.inOut" }, 5.55);
        tl.fromTo("#blade", { scale: 1.1, rotation: -3, transformOrigin: "50% 50%" }, { scale: 1.25, rotation: 1, duration: 0.75, ease: "none" }, 5.5);
        tl.fromTo("#eye2", { scale: 1.6, filter: "hue-rotate(0deg) saturate(1)" }, { scale: 1.9, filter: "hue-rotate(45deg) saturate(1.6)", duration: 0.75, ease: "power1.in" }, 6.25);

        // S4 — manga panels slam in
        flash(7.0, 0.9, 0.25);
        tl.fromTo("#p1", { x: -1100 }, { x: 0, duration: 0.28, ease: "expo.out" }, 7.0);
        tl.fromTo("#p2", { x: 1100 }, { x: 0, duration: 0.28, ease: "expo.out" }, 7.5);
        tl.fromTo("#p3", { x: -1100 }, { x: 0, duration: 0.28, ease: "expo.out" }, 8.0);
        shake(7.0, 18);
        shake(7.5, 18);
        shake(8.0, 18);
        tl.fromTo("#p1-eye", { scale: 1, filter: "hue-rotate(45deg) saturate(1.6)" }, { scale: 1.12, filter: "hue-rotate(45deg) saturate(1.6)", duration: 3, ease: "none" }, 7);
        tl.fromTo("#p2-aura", { scale: 0.6, opacity: 0.4 }, { scale: 1.35, opacity: 1, duration: 2.5, ease: "power2.in" }, 7.5);
        tl.fromTo("#p2-man", { y: 40 }, { y: 0, duration: 2.5, ease: "power1.out" }, 7.5);
        tl.fromTo("#p3-kanji", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "expo.out" }, 8.1);
        tl.fromTo("#p3-en", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.4);
        // Build tension: accelerating micro-shakes + zoom
        tl.fromTo("#s4 .scn", { scale: 1 }, { scale: 1.06, duration: 1.4, ease: "power2.in" }, 8.6);
        [9.0, 9.25, 9.5, 9.625, 9.75, 9.875].forEach((t, i) => shake(t, 8 + i * 4, 3));
        flash(9.9, 0.6, 0.1);

        // S5 — the drop
        tl.fromTo("#flash", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 10.0);
        speedBurst(10.0, 1.4, 1);
        shake(10.0, 60, 12);
        ["#ring1", "#ring2", "#ring3"].forEach((r, i) => {
          tl.fromTo(r, { scale: 0.1, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.9, ease: "expo.out" }, 10.0 + i * 0.18);
        });
        tl.fromTo("#glitch", { scale: 2.4 }, { scale: 1, duration: 0.25, ease: "expo.out" }, 10.02);
        tl.to("#glitch", { scale: 1.1, duration: 1.7, ease: "none" }, 10.27);
        // RGB-split glitch: stepped offsets
        const gT = [10.0, 10.08, 10.16, 10.3, 10.5, 10.62, 10.9, 11.0, 11.3, 11.42, 11.5, 11.7];
        gT.forEach((t, i) => {
          const big = i < 4 || i % 3 === 0;
          const a = big ? 34 : 10;
          tl.set("#gc", { x: R(-a, a), y: R(-a / 2, a / 2) }, t);
          tl.set("#gm", { x: R(-a, a), y: R(-a / 2, a / 2) }, t);
          tl.set("#gw", { x: big ? R(-12, 12) : 0, skewX: big ? R(-12, 12) : 0 }, t);
        });
        tl.set(["#gc", "#gm", "#gw"], { x: 0, y: 0, skewX: 0 }, 11.8);
        // beat hits during the drop
        [10.5, 11.0, 11.5].forEach((t) => {
          flash(t, 0.35, 0.15);
          shake(t, 20, 4);
        });

        // S6 — slash
        flash(12.0, 0.8, 0.3);
        tl.fromTo("#s6 .scn", { rotation: -3, scale: 1.08 }, { rotation: 3, scale: 1, duration: 5, ease: "none" }, 12);
        tl.fromTo("#s6-kanji", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 12.1);
        tl.fromTo("#s6-aura", { scale: 1.18 }, { scale: 0.96, duration: BEAT, repeat: 9, ease: "power2.out" }, 12);
        tl.fromTo("#s6-man", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 12.0);
        ["#slash1", "#slash2"].forEach((id, w) => {
          const path = document.querySelector(id);
          const len = path.getTotalLength();
          const t = w === 0 ? 12.5 : 14.0;
          tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, duration: 0.18, ease: "power4.out" }, t);
          tl.to(path, { opacity: 0, duration: 1.2, ease: "power2.in" }, t + 0.5);
          flash(t + 0.05, 0.85, 0.3);
          shake(t + 0.05, 44, 9);
          speedBurst(t + 0.05, 0.5, 0.6);
          sparkData
            .filter((s) => s.wave === w)
            .forEach((s) => {
              const pt = path.getPointAtLength(len * s.u);
              const rad = (s.ang * Math.PI) / 180;
              tl.fromTo(
                s.node,
                { x: pt.x, y: pt.y, rotation: s.ang, opacity: 1, scaleX: 1.6 },
                { x: pt.x + Math.cos(rad) * s.dist, y: pt.y + Math.sin(rad) * s.dist + 120, opacity: 0, scaleX: 0.3, duration: 0.9, ease: "power3.out", immediateRender: false },
                t + 0.05
              );
            });
        });
        [15.0, 15.5, 16.0, 16.25, 16.5].forEach((t) => shake(t, 12, 3));
        flash(16.5, 0.9, 0.4);
        tl.to("#s6 .scn", { opacity: 0, duration: 0.15, ease: "none" }, 16.85);

        // S7 — end card
        flash(17.0, 0.7, 0.5);
        tl.fromTo("#s7-title", { opacity: 0, scale: 1.3, scaleX: 1.5 }, { opacity: 1, scale: 1, scaleX: 1, duration: 0.9, ease: "expo.out" }, 17.05);
        tl.fromTo("#s7-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 17.4);
        tl.fromTo("#s7-ep", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 17.7);
        tl.fromTo("#s7-jp", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 18.0);
        tl.to("#s7-title", { textShadow: "0 0 80px #ff2fb4, 5px 0 0 rgba(255,47,180,0.8), -5px 0 0 rgba(53,242,255,0.8)", duration: 0.5, repeat: 2, yoyo: true, ease: "sine.inOut" }, 18.0);
        tl.to("#fade", { opacity: 1, duration: 0.6, ease: "power1.in" }, 19.4);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
