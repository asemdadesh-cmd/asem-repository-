  <header class="site-header">
    <div class="announce">
      <div class="container">
        <span data-i18n="announce.text">شحن مجاني لكل الطلبات فوق 1500 د.ل — إلى 22 مدينة ليبية</span>
        <a href="shop.html?sale=1" data-i18n="announce.cta">تسوّق الآن</a>
      </div>
    </div>

    <div class="container">
      <div class="header-bar">
        <button class="icon-btn menu-btn" data-drawer-open="nav-drawer" data-i18n-attr="aria-label:nav.menu"
                aria-label="القائمة" aria-controls="nav-drawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <a class="logo" href="index.html">
          <img class="logo__mark" src="assets/img/logo.svg" alt="" width="34" height="34">
          <span class="logo__text">
            <span class="logo__name" data-i18n="brand.name">برق</span>
            <span class="logo__tag" data-i18n="brand.tagline">إلكترونيات ليبيا</span>
          </span>
          <span class="sr-only" data-i18n="brand.full">برق للإلكترونيات</span>
        </a>

        <nav class="nav" aria-label="Main">
          <a class="nav__link" href="index.html" data-i18n="nav.home">الرئيسية</a>
          <a class="nav__link" href="shop.html" data-i18n="nav.shop">المتجر</a>
          <a class="nav__link" href="shop.html?sale=1" data-i18n="nav.deals">العروض</a>
          <a class="nav__link" href="about.html" data-i18n="nav.about">من نحن</a>
          <a class="nav__link" href="contact.html" data-i18n="nav.contact">اتصل بنا</a>
        </nav>

        <form class="search" role="search" data-search action="shop.html" method="get">
          <label class="sr-only" for="site-search" data-i18n="search.label">ابحث عن منتج</label>
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="input search__input" type="search" id="site-search" name="q" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list"
                 data-i18n-attr="placeholder:search.placeholder" placeholder="ابحث عن هاتف، لابتوب، مكيف…">
          <div class="search__results" id="search-results" role="listbox" data-search-results hidden></div>
        </form>

        <div class="header-actions">
          <div class="switch switch--desktop" role="group" data-i18n-attr="aria-label:a11y.lang" aria-label="تغيير اللغة">
            <button type="button" data-lang-btn="ar" aria-pressed="true" lang="ar">ع</button>
            <button type="button" data-lang-btn="en" aria-pressed="false" lang="en">EN</button>
          </div>

          <div class="switch switch--desktop" role="group" data-i18n-attr="aria-label:a11y.theme" aria-label="تبديل المظهر">
            <button type="button" data-theme-btn="dark" aria-pressed="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
              <span class="sr-only" data-i18n="theme.dark">داكن</span>
            </button>
            <button type="button" data-theme-btn="light" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <span class="sr-only" data-i18n="theme.light">فاتح</span>
            </button>
          </div>

          <a class="icon-btn icon-btn--desktop" href="compare.html" data-i18n-attr="aria-label:a11y.compare" aria-label="المقارنة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h7M4 12h7M4 18h7"/><path d="M15 4l5 4-5 4"/><path d="M20 8h-5"/><path d="M15 14l5 4-5 4"/><path d="M20 18h-5"/></svg>
            <span class="icon-btn__count num" data-compare-count hidden>0</span>
          </a>

          <button class="icon-btn" data-drawer-open="cart-drawer" data-i18n-attr="aria-label:a11y.cart"
                  aria-label="سلة التسوق" aria-controls="cart-drawer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
            <span class="icon-btn__count num" data-cart-count hidden>0</span>
          </button>
        </div>
      </div>
    </div>
  </header>
