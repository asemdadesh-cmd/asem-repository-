<!doctype html>
<html lang="ar" dir="rtl" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical }}">
  {{ hreflang }}
  {{ noindex }}

  <meta name="theme-color" content="#0A0D14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

  <meta property="og:type" content="{{ ogType }}">
  <meta property="og:site_name" content="{{ siteName }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="https://barq.ly/assets/img/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ar_LY">
  <meta property="og:locale:alternate" content="en_LY">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="https://barq.ly/assets/img/og-cover.png">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Language and theme are applied before first paint so neither flashes. -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var q = new URLSearchParams(location.search).get('lang');
        var l = (q === 'ar' || q === 'en') ? q : localStorage.getItem('barq.lang');
        if (l !== 'ar' && l !== 'en') l = 'ar';
        d.lang = l;
        d.dir = l === 'ar' ? 'rtl' : 'ltr';
        var t = localStorage.getItem('barq.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        d.setAttribute('data-theme', t);
      } catch (e) { d.setAttribute('data-theme', 'dark'); }
      d.className = d.className.replace('no-js', '');
    })();
  </script>

  <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  {{ jsonld }}
</head>
<body class="{{ bodyClass }}" data-page="{{ page }}">
  <div class="scroll-progress" data-progress aria-hidden="true"></div>
  <a class="skip-link" href="#main" data-i18n="nav.skip">تخطَّ إلى المحتوى</a>

  {{> header }}

  <main id="main">
{{ content }}
  </main>

  {{> footer }}
  {{> drawers }}

  <script type="module" src="assets/js/{{ script }}"></script>
</body>
</html>
