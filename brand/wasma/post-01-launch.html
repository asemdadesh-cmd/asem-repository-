<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#F8F7F3;font-family:Inter,sans-serif;color:#111;position:relative;overflow:hidden}
.top{padding:84px 88px 0;display:flex;justify-content:space-between;align-items:center}
.top img{height:78px;}
.tag{font-size:22px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border:2px solid #111;border-radius:999px;padding:12px 24px}
h1{font-size:118px;line-height:.98;font-weight:800;letter-spacing:-.045em;padding:110px 88px 0}
h1 .hl{background:#CCFF33;padding:0 14px;margin-left:-14px}
.ar{font-family:Cairo,sans-serif;font-size:46px;font-weight:700;direction:rtl;text-align:left;padding:34px 88px 0;color:#111}
.ar span{display:inline-block}
.list{padding:80px 88px 0;display:grid;grid-template-columns:1fr 1fr;gap:40px 40px}
.item{display:flex;align-items:center;gap:22px;font-size:40px;font-weight:700;letter-spacing:-.01em}
.sq{width:22px;height:22px;background:#CCFF33;outline:3px solid #111;flex:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:190px;background:#111;color:#F8F7F3;display:flex;align-items:center;justify-content:space-between;padding:0 88px}
.bar b{font-size:42px;font-weight:800;letter-spacing:-.02em}
.bar .cta{background:#CCFF33;color:#111;font-size:30px;font-weight:800;padding:24px 36px;border-radius:14px}
.corner{position:absolute;right:88px;bottom:190px;width:96px;height:96px;background:#CCFF33}
.lang{position:absolute;left:88px;bottom:250px;font-size:28px;font-weight:600;color:#555}
</style></head><body>
<div class="top"><img src="lockup_t.png" alt="Wasma"><div class="tag">Now open</div></div>
<h1>Look sharp.<br><span class="hl">Run smarter.</span></h1>
<div class="ar"><span>مواقع وأتمتة وذكاء اصطناعي لأعمالك</span></div>
<div class="list">
 <div class="item"><i class="sq"></i>Websites</div>
 <div class="item"><i class="sq"></i>Automations</div>
 <div class="item"><i class="sq"></i>AI chatbots</div>
 <div class="item"><i class="sq"></i>Digital menus</div>
 <div class="item"><i class="sq"></i>Booking systems</div>
 <div class="item"><i class="sq"></i>Landing pages</div>
</div>
<div class="lang">English &amp; العربية — we speak your language.</div><div class="corner"></div>
<div class="bar"><b>Wasma Digital</b><div class="cta">Message us →</div></div>
</body></html>
